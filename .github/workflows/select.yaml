name: Deploy

on:
  workflow_dispatch:
    inputs:
      projeto:
        description: "api ou cronjob"
        required: true
        type: choice
        options:
          - api
          - cronjob

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: API desativa cron
        if: github.event.inputs.projeto == 'api'
        run: |
          sed -i 's/cron.enabled=true/cron.enabled=false/' application.properties

      - name: Cronjob ativa cron
        if: github.event.inputs.projeto == 'cronjob'
        run: |
          sed -i 's/cron.enabled=false/cron.enabled=true/' application.properties

      - name: Mostrar resultado
        run: cat application.properties
