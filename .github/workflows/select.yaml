name: Deploy

on:
  workflow_dispatch:
    inputs:
      projeto:
        description: "api ou cronjob"
        required: true
        type: choice
        options:
          - api
          - cronjob

jobs:
  build:
    if: github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Mostrar projeto
        run: echo "Projeto escolhido: ${{ github.event.inputs.projeto }}"

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detectar projeto
        id: projeto
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "projetoa.yaml"; then
            echo "tipo=projetoa" >> $GITHUB_OUTPUT
          elif git diff --name-only HEAD~1 HEAD | grep -q "projetob.yaml"; then
            echo "tipo=projetob" >> $GITHUB_OUTPUT
          fi

      - name: Alterar arquivo apenas no Projeto A
        if: steps.projeto.outputs.tipo == 'projetoa'
        run: |
          echo "ALTERADO PELO PROJETO A" > config/app.txt

      - name: Não alterar no Projeto B
        if: steps.projeto.outputs.tipo == 'projetob'
        run: |
          echo "Projeto B não altera arquivo"
