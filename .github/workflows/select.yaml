name: Criar Repositorio Privado com Branch Develop

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: 'Nome do novo repositorio'
        required: true
        type: string
      create_ruleset:
        type: boolean
        default: false

jobs:
  configurar_repositorio:
    runs-on: ubuntu-latest
    steps:
      - name: Criar Estrutura e Push na Branch Develop
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO_NAME: ${{ github.event.inputs.repo_name }}
        run: |
          # 1. Cria o repositório remoto como privado (--private)
          gh repo create "$REPO_NAME" --private
          
          # 2. Inicializa o repositório local diretamente na branch develop
          mkdir "$REPO_NAME" && cd "$REPO_NAME"
          git init -b develop
          
          # 3. Cria o arquivo README.md
          echo "# $REPO_NAME" > README.md
          echo "Este repositório privado foi criado via GitHub Actions." >> README.md

          # 4. Cria o arquivo inputs.yml
          echo "# $REPO_NAME" > inputs.yml
          cat << 'EOF' > inputs.yml
          SKIP_BUILD: false
          CONFIGMAP_DEPLOY: false
          SECRETS_DEPLOY: false
          REPLICAS: 1
          
          # 5. Cria a pasta .github/workflows e o arquivo develop.yaml
          mkdir -p .github/workflows
          cat << 'EOF' > .github/workflows/develop.yaml
          name: CI Develop
          
          on:
            push:
              branches:
                - develop
          
          jobs:
            CallTemplate:
              uses: ""
              with: ""
                project: ""
                dockefile: ""
                environment: ""
              secrets: inherit

            build:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout do codigo
                  uses: actions/checkout@v4
                  
                - name: Executar Testes
                  run: echo "Executando os testes automatizados na branch develop..."
          EOF
          
          # 6. Configura a identidade do Git Bot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          
          # 7. Faz o commit inicial e o push da branch develop
          git add .
          git commit -m "chore: inicializacao do repositorio na branch develop"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/$REPO_NAME.git"
          
          # Como develop e a primeira branch a subir, o GitHub a define automaticamente como default
          git push --set-upstream origin develop

      - name: Criar Ruleset Preventivo para a Master
        if: ${{ github.event.inputs.create_ruleset == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          OWNER: ${{ github.event.inputs.owner }}
          REPO_NAME: ${{ github.event.inputs.repo_name }}
        run: |
          cat << 'EOF' > ruleset.json
          {
            "name": "Protecao da Master via Actions",
            "target": "branch",
            "enforcement": "active",
            "conditions": {
              "ref_name": {
                "include": [
                  "refs/heads/master"
                ],
                "exclude": []
              }
            },
            "rules": [
              {
                "type": "deletion"
              },
              {
                "type": "non_fast_forward"
              },
              {
                "type": "pull_request",
                "parameters": {
                  "required_approving_review_count": 1,
                  "dismiss_stale_reviews_on_push": true,
                  "require_code_owner_review": false,
                  "require_last_push_approval": false,
                  "required_review_thread_resolution": false
                }
              }
            ]
          }
          EOF

          gh api repos/$OWNER/$REPO_NAME/rulesets \
            --input ruleset.json
